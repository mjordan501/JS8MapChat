<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JS8MapChat</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Leaflet 1.9.4, shipped in the installer rather than fetched from a CDN.
     JS8Map is an offline tool: on a machine with no internet the CDN copy
     never arrived, so the library never loaded and the map page came up
     completely blank -- no stations, no borders, nothing. Same version,
     same behaviour, now present on disk. -->
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<link rel="stylesheet" href="app.css">
<style id="label-zoom-style"></style>
<style id="js8map-group-css"></style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <div class="station-badge">
    <img src="JS8Map_icon.png" alt="" style="width:28px;height:28px;margin-right:8px;flex-shrink:0;">
    <span class="call" id="hdr-call"></span>
    <span class="meta">Grid:&nbsp;<span id="hdr-grid"></span>&nbsp;&nbsp;·&nbsp;&nbsp;JS8MapChat&nbsp;1.75.1&nbsp;&nbsp;·&nbsp;&nbsp;<span id="hdr-gen"></span></span>
  </div>
  <div class="vbar"></div>
  <div class="stats">
    <div class="stat" data-filter="heard" onclick="quickFilter('heard')" title="Click to filter: I Hear only" style="cursor:pointer">
      <div class="num c-blue"  id="cnt-heard">0</div>
      <div class="lbl">I Hear</div>
    </div>
    <div class="stat" data-filter="hearing_me" onclick="quickFilter('hearing_me')" title="Click to filter: Hear Me only" style="cursor:pointer">
      <div class="num c-green" id="cnt-hearing">0</div>
      <div class="lbl">Hear Me</div>
    </div>
    <div class="stat" data-filter="both" onclick="quickFilter('both')" title="Click to filter: Mutual only" style="cursor:pointer">
      <div class="num c-orange" id="cnt-both">0</div>
      <div class="lbl">Mutual</div>
    </div>
    <div class="stat" data-filter="via_hb" onclick="quickFilter('via_hb')" title="Click to filter: Via Heartbeat only" style="cursor:pointer">
      <div class="num" style="color:gold;" id="cnt-hb">0</div>
      <div class="lbl">RX HB</div>
    </div>
    <div class="stat" data-filter="watched" onclick="quickFilter('watched')" title="Click to filter: Watched callsigns only" style="cursor:pointer">
      <div class="num" style="color:#FFE000;" id="cnt-watched">0</div>
      <div class="lbl">⭐ Watched</div>
    </div>
    <div class="stat" data-filter="all" onclick="quickFilter('all')" title="Click to show all" style="cursor:pointer">
      <div class="num c-white" id="cnt-total">0</div>
      <div class="lbl">Total</div>
    </div>
  </div>
  <button id="open-fastchat-btn" class="appswitch-btn" onclick="openFastChatWindow()"
          title="Open JS8FastChat (bring its window to the front)"
          aria-label="Open JS8FastChat">
    <img src="fastchat_icon.png" alt="" class="appswitch-icon">
  </button>

<!-- Filter bar -->
<!-- Filter bar — map controls only; use top stats to filter -->
<div id="filterbar">
  <button class="map-toggle-btn" id="label-btn"     onclick="toggleLabels()">🏷 Hide Labels</button>
  <button class="map-toggle-btn" id="map-style-btn" onclick="toggleStyle()">🌙 Dark Map</button>
  <button class="map-toggle-btn" id="places-btn"    onclick="togglePlaces()"
    title="Show / hide country, state and city names">🌐 Hide Names</button>
  <button class="map-toggle-btn" id="fitall-btn"    onclick="fitAll()" title="Zoom to show all stations  [F]">⛶ Fit All</button>
  <button class="map-toggle-btn" id="drawbox-btn"   onclick="toggleDrawBox()"
    title="Draw Box Zoom — click to activate, then drag to select area. Also works with right-click drag anytime.">📐 Box</button>
  <button class="map-toggle-btn" id="anim-btn" onclick="toggleAnim()"
    title="Enable / disable relay animation comets">🎬 Anim On</button>

  <select id="popup-select" onchange="setPopupDefault(this.value)"
    title="Default popup view when clicking a station"
    class="map-dropdown">
    <option value="full"    selected>Popup: Full</option>
    <option value="compact">Popup: Compact</option>
  </select>

  <select id="new-filter-select" onchange="setNewFilter(parseInt(this.value))"
    title="Show only stations first heard within this many minutes."
    class="map-dropdown">
    <option value="0" selected>🆕 New: Off</option>
    <option value="1">🆕 New: 1 min</option>
    <option value="2">🆕 New: 2 min</option>
    <option value="3">🆕 New: 3 min</option>
    <option value="4">🆕 New: 4 min</option>
    <option value="5">🆕 New: 5 min</option>
  </select>

  <select id="active-filter-select" onchange="setActiveFilter(parseInt(this.value))"
    title="Show only stations active (last heard) within this many minutes — matches JS8Call's Age column."
    class="map-dropdown">
    <option value="0" selected>🕐 Active: Off</option>
    <option value="1">🕐 Active: 1 min</option>
    <option value="5">🕐 Active: 5 min</option>
    <option value="10">🕐 Active: 10 min</option>
    <option value="15">🕐 Active: 15 min</option>
    <option value="30">🕐 Active: 30 min</option>
  </select>

  <select id="group-filter" onchange="applyFilters(); setTimeout(fitAll,150);"
    title="Show only stations active in a specific group"
    class="map-dropdown">
    <option value="">Groups: Off</option>
  </select>

  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
    <!-- Relay filter -->
    <!-- relay-bar hidden: relays now start from the map/Python flow only.
         Kept in the DOM (display:none) so relay auto-populate code that
         reads/writes #relay-search still works; the manual input is just no
         longer shown (typing a callsign here is no longer part of the flow). -->
    <div style="display:none;position:relative;align-items:center;gap:4px;" id="relay-bar">
      <input id="relay-search" placeholder="🔁 Relay to callsign…"
        style="font-family:var(--font-main);font-size:13px;font-weight:600;
          background:var(--surface);border:1.5px solid rgba(41,121,255,0.5);
          color:var(--text);padding:5px 28px 5px 10px;border-radius:20px;
          outline:none;width:180px;transition:border-color .2s;"
        oninput="this.value=this.value.toUpperCase();"
        onkeydown="if(event.key==='Enter'){applyRelayFilter(this.value);}else if(event.key==='Escape'){this.value='';applyRelayFilter('');this.blur();}"
        title="Filter map to show only stations that can relay to this callsign"/>
      <button id="relay-clear"
        onclick="$('relay-search').value='';applyRelayFilter('');this.style.display='none';"
        style="display:none;position:absolute;right:6px;background:none;border:none;
          cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);padding:0 2px;"
        title="Clear relay filter">✕</button>
    </div>
    <div style="position:relative;display:flex;align-items:center;">
      <input class="search" id="search" placeholder="🔍  Find callsign…  [/]"
             oninput="this.value=this.value.toUpperCase();applyFilters();$('search-clear').style.display=this.value?'flex':'none';"
             onkeydown="if(event.key==='Enter') zoomToCallsign(this.value)" />
      <button id="search-clear"
        onclick="$('search').value='';applyFilters();this.style.display='none';$('search').focus();"
        style="display:none;position:absolute;right:8px;
          background:none;border:none;cursor:pointer;
          font-size:14px;font-weight:700;color:var(--muted);
          line-height:1;padding:0 2px;transition:color .15s;"
        onmouseover="this.style.color='var(--text)'"
        onmouseout="this.style.color='var(--muted)'"
        title="Clear search">✕</button>
    </div>
    </div>
  </div>
</div>


<div id="relay-lag-banner"></div>
<div id="map"></div>
<div id="scan-overlay"><div id="scan-line"></div></div>
<div id="scan-done">✓ Updated</div>


<!-- Legend -->
<div id="legend-tab" onclick="toggleLegend()"
  style="position:fixed;bottom:10px;right:10px;z-index:1000;
    background:var(--popup-bg);border:1px solid var(--popup-border);
    border-radius:8px;padding:5px 12px;cursor:pointer;
    font-size:12px;font-weight:700;color:var(--muted);
    backdrop-filter:blur(6px);user-select:none;
    transition:background .2s;"
  title="Show/hide legend">≡ Legend</div>

<div id="legend" style="display:none;">
  <div class="l-head" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleLegend()">
    <span>Legend</span>
    <span style="font-size:14px;line-height:1;">✕</span>
  </div>
  <div class="l-row">
    <div class="l-dot" style="background:var(--red);box-shadow:0 0 6px var(--red)"></div>
    My Station
  </div>
  <div class="l-row">
    <div class="l-dot" style="background:var(--blue)"></div>
    I Hear
  </div>
  <div class="l-row">
    <div class="l-dot" style="background:var(--green)"></div>
    Hearing Me
  </div>
  <div class="l-row">
    <div class="l-dot" style="background:var(--orange)"></div>
    Mutual
  </div>
  <div style="border-top:1px solid var(--border);margin:8px 0 4px"></div>
  <div class="l-line"><div class="l-solid"></div> Solid line</div>
  <div class="l-line"><div class="l-dashes"></div> Dashed line</div>
  <div style="border-top:1px solid var(--border);margin:6px 0 4px"></div>
  <div class="l-row"><div class="l-hb"></div> Via Heartbeat</div>
  <div class="l-row">
    <div style="width:14px;height:14px;border-radius:50%;background:#26a869;
      border:1.5px solid rgba(255,255,255,0.9);font-size:8px;font-weight:700;
      color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">3</div>
    Heard by N stations
  </div>
  <div class="l-row">
    <div style="width:14px;height:14px;border-radius:50%;background:#0097a7;
      border:1.5px solid rgba(255,255,255,0.9);font-size:8px;font-weight:700;
      color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">4</div>
    Hears N stations (HEARING? reply)
  </div>
  <div class="l-row" style="color:var(--legend-gold);">
    <span style="font-size:13px;">✉</span> MSG waiting in inbox
  </div>
  <div class="l-row" style="color:var(--legend-gold);">
    <span style="font-size:13px;">⭐</span> Watched callsign
  </div>
</div>

<script src="boot.js"></script>
<script src="app.js"></script>
</body>
</html>
